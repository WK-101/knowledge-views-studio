# Parley's detekt rules, on top of detekt's defaults (buildUponDefaultConfig). Existing findings live in
# baseline.xml, so only new code has to follow them; fix a finding and regenerate the baseline with
# `./gradlew detektBaseline` to shrink it. Formatting comes from the ktlint rules of detekt-formatting.

exceptions:
  # A caught exception must be used (rethrown, logged, wrapped) or the catch must say why it's ignored
  # (name it `_`, `ignored` or `expected`).
  SwallowedException:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected).*'
  TooGenericExceptionCaught:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected).*'
  TooGenericExceptionThrown:
    active: true

empty-blocks:
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected).*'

complexity:
  LongMethod:
    active: true
    threshold: 80
    # Composables are long by nature; they get their own, larger limit through the baseline for now.
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    active: false

style:
  # UI code talks to repositories and view models, never to Room entities or DAOs.
  ForbiddenImport:
    active: true
    includes: ['**/ui/**']
    # View models and use cases are the layer that may talk to the database; composables may not.
    excludes: ['**/*ViewModel.kt', '**/*UseCase.kt']
    imports:
      - value: 'app.parley.data.db.*'
        reason: 'UI code must not use Room entities or DAOs; go through a repository or the view model.'
  MaxLineLength:
    active: true
    maxLineLength: 160
    excludeCommentStatements: true
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  ReturnCount:
    active: false
  ForbiddenComment:
    active: false

naming:
  FunctionNaming:
    # Composables are PascalCase; tests in core:common use snake_case names.
    ignoreAnnotated: ['Composable', 'Test']

formatting:
  # The codebase's own line length (and MaxLineLength above) instead of ktlint's.
  MaximumLineLength:
    active: false
  # Imports are grouped by hand in places; ordering churn isn't worth a finding.
  ImportOrdering:
    active: false
  # The codebase keeps calls, parameter lists and short if/else on one line up to the line limit; ktlint's wrapping
  # rules would flag most of it (over 12,000 findings) without catching bugs.
  ArgumentListWrapping:
    active: false
  ParameterListWrapping:
    active: false
  Wrapping:
    active: false
  PropertyWrapping:
    active: false
  MultiLineIfElse:
    active: false

# Parley's own rules (tools/detekt-rules).
parley:
  # Raw TopAppBar, AlertDialog, ModalBottomSheet, RoundedCornerShape, ListItem and Switch outside core/ui, which wraps them.
  DesignSystemComponent:
    active: true
    excludes: ['**/core/ui/**', '**/tools/**']
  # System toasts inside Parley's screens (the snackbar is the one feedback channel there).
  SystemToast:
    active: true
    excludes: ['**/core/ui/**', '**/tools/**']
  # PhoneNumbers outside app.parley.common: PhoneIdentity is the one path for comparing and keying numbers.
  PhoneNumbersOutsideIdentity:
    active: true
    # core/common's own tests may check the internals behind PhoneIdentity.
    excludes: ['**/core/common/src/test/**']
  # runCatching inside suspend functions and coroutine blocks (it swallows cancellation); use catching {}.
  # It holds for new code only: the sites that predate it are listed in baseline.xml and are burned down over time,
  # core/data and the call path first. It is not a ban on the code as it stands.
  RunCatchingInSuspend:
    active: true
    excludes: ['**/test/**', '**/testShared/**', '**/tools/**']
  # The raw privacy switches ("Hide private contacts", the duress hiding, "Caller on the lock screen") outside the one
  # place that combines them: features read PrivacyView (c.privacy). The settings, their screens and the duress
  # machinery are where the switches live.
  RawPrivacySwitch:
    active: true
    excludes:
      - '**/test/**'
      - '**/testShared/**'
      - '**/tools/**'
      - '**/core/common/src/main/kotlin/app/parley/common/Settings.kt'
      - '**/core/common/src/main/kotlin/app/parley/common/security/**'
      - '**/core/data/src/main/kotlin/app/parley/data/security/**'
      - '**/core/data/src/main/kotlin/app/parley/data/SettingsRepository.kt'
      - '**/core/data/src/main/kotlin/app/parley/data/people/Diagnostics.kt'
      - '**/app/src/main/kotlin/app/parley/ui/settings/SettingsPages.kt'
      - '**/app/src/main/kotlin/app/parley/security/AppLock.kt'
      - '**/app/src/main/kotlin/app/parley/security/VaultTileService.kt'
      - '**/app/src/main/kotlin/app/parley/security/PinConfirm.kt'
  # File.renameTo outside DurableFiles: replacing a file must sync it first (see DurableFiles).
  RawRename:
    active: true
    excludes: ['**/test/**', '**/testShared/**', '**/tools/**']
  # Private contacts are marked with core/ui's PrivateBadge or PrivateMarked, never a lock character or a list's own
  # badge; the lists named here must use the shared one. String resources are checked by PrivateMarkTest.
  PrivateMark:
    active: true
    includes: ['**/app/src/main/**', '**/telecom/src/main/**']
    lists: ['ContactsTab.kt', 'FavoritesTab.kt', 'RecentsTab.kt', 'CircleTab.kt', 'ToCallScreen.kt', 'RecentsLegend.kt', 'KeypadTab.kt']
  # Every @Suppress says why in a // comment on its line or just above it.
  SuppressWithoutReason:
    active: true
