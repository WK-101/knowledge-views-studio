org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# R8 decides which resources are reachable from the code it keeps (the default from AGP 9): strings, layouts and
# drawables used only by removed code go too. Smaller resources.arsc; see docs/PERFORMANCE_BENCHMARKS.md.
android.r8.optimizedResourceShrinking=true
