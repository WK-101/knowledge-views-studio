# R95 — 2 GiB starved R8 when the release build ran alongside the test + lint tasks in one daemon
# (GC-thrash, no progress). 4 GiB gives R8/lint real headroom; a metaspace cap and MaxRAMPercentage
# keep it bounded. Comfortable on a standard CI runner (7 GiB) and locally.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# R108 audit A4 — run resource shrinking inside the R8 pipeline so resources tied to code that R8
# removes are dropped too (safe: only removes resources whose referencing code is already dead).
android.r8.optimizedResourceShrinking=true
