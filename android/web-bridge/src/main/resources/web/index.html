<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="referrer" content="no-referrer" />
  <title>Hexis</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="shell" data-domain="tasks" data-sidebar="open" data-inspector="closed" data-density="default">
    <nav class="rail" id="rail" aria-label="Sections"></nav>
    <aside class="sidebar" id="sidebar" aria-label="Filters"></aside>
    <main class="main">
      <header class="main-head" id="mainHead"></header>
      <p class="status" id="status" hidden></p>
      <div class="main-body" id="mainBody"></div>
    </main>
    <aside class="inspector" id="inspector" aria-label="Detail" hidden></aside>
    <div class="scrim" id="scrim" hidden></div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="icons.js"></script>
  <script src="core.js"></script>
  <script src="palette.js"></script>
  <script src="tasks.js"></script>
  <script src="task-editor.js"></script>
  <script src="calendar.js"></script>
  <script src="notes.js"></script>
  <script src="habits.js"></script>
  <script src="time.js"></script>
  <script src="misc.js"></script>
</body>
</html>
