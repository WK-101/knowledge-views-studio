name: Parley

# Checks for the Android app in parley-phone/ (the rest of the repository has its own workflows).
# No secrets: the release build is unsigned, exactly as F-Droid builds it.

on:
  push:
    paths:
      - "parley-phone/**"
      - ".github/workflows/parley.yml"
  pull_request:
    paths:
      - "parley-phone/**"
      - ".github/workflows/parley.yml"

permissions:
  contents: read

concurrency:
  group: parley-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests · Lint · Static analysis · Guards · Release build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: parley-phone
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Caches the Gradle distribution, dependencies and build cache between runs.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Android SDK location
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Every step below checks each downloaded artifact against gradle/verification-metadata.xml (SHA-256);
      # an artifact that isn't listed or doesn't match fails the job.
      - name: Dependency verification metadata present
        run: test -s gradle/verification-metadata.xml

      - name: Unit tests (all modules, Robolectric included)
        run: ./gradlew --stacktrace :core:common:test testDebugUnitTest

      - name: Hard-coded UI text
        run: ./gradlew checkHardcodedText -PfailOnHardcodedText=true

      - name: Android lint (errors fail the build)
        run: ./gradlew lintDebug

      - name: detekt (new findings fail; existing ones are in config/detekt/baseline.xml)
        run: ./gradlew detekt

      - name: Permission guard (allow-list, both apps, both build types)
        run: >-
          ./gradlew :app:checkDebugPermissions :app:checkReleasePermissions
          :lists-updater:checkDebugUpdaterPermissions :lists-updater:checkReleaseUpdaterPermissions

      - name: Release build (unsigned) and APK-size budget
        run: ./gradlew :app:assembleRelease :lists-updater:assembleRelease :app:checkReleaseApkSize

      # The macrobenchmarks and the baseline-profile generator need a device, but they must at least build, so they
      # are ready when one is connected (docs/PERFORMANCE_BENCHMARKS.md).
      - name: Benchmark module builds (no device)
        run: ./gradlew :baselineprofile:assembleBenchmarkRelease

      - name: F-Droid signing-config strip check
        run: tools/fdroid-strip-check.sh --static

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parley-reports
          path: |
            parley-phone/**/build/reports/
            parley-phone/build/reports/
          if-no-files-found: ignore
          retention-days: 14
