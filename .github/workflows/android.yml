name: Android CI

on:
  push:
    branches: [ "claude/android-article-reader-app-54qk9q", "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cairn-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cairn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # Job-level env so the keystore secret is visible to each step's own `if:` — a step-level
    # `env:` is NOT in scope for that step's `if` (it is evaluated before the step env is applied),
    # which previously made the decode step always skip and shipped an UNSIGNED release.
    env:
      CAIRN_KEYSTORE_BASE64: ${{ secrets.CAIRN_KEYSTORE_BASE64 }}
      CAIRN_KEYSTORE_PASSWORD: ${{ secrets.CAIRN_KEYSTORE_PASSWORD }}
      CAIRN_KEY_ALIAS: ${{ secrets.CAIRN_KEY_ALIAS }}
      CAIRN_KEY_PASSWORD: ${{ secrets.CAIRN_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Require signing secrets
        # A tagged release MUST be signed. Fail loudly and early if the keystore secret is absent,
        # rather than silently publishing an unsigned/uninstallable-over-update artifact.
        run: |
          if [ -z "$CAIRN_KEYSTORE_BASE64" ]; then
            echo "::error::CAIRN_KEYSTORE_BASE64 is not set — cannot produce a signed release. Configure the signing secrets before tagging a release."
            exit 1
          fi

      - name: Decode keystore
        run: |
          echo "$CAIRN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cairn.keystore"
          echo "CAIRN_KEYSTORE_PATH=$RUNNER_TEMP/cairn.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify every release APK is signed
        # Hard gate: apksigner must confirm a valid v2/v3 signature on each APK, or the job fails
        # before anything is published. This is what catches a signing regression in the future.
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then echo "::error::apksigner not found"; exit 1; fi
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then echo "::error::no release APKs produced"; exit 1; fi
          for apk in "${apks[@]}"; do
            echo "Verifying $apk"
            "$APKSIGNER" verify --min-sdk-version 26 "$apk" || { echo "::error::$apk is not properly signed"; exit 1; }
          done
          echo "All ${#apks[@]} release APK(s) verified signed."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
