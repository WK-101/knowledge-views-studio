name: Android APK

# Builds an installable release APK and uploads it as a downloadable artifact.
# You never sign anything: if the signing secrets below are set, the APK is signed
# with your stable release key (so updates install over the top). If they are not
# set, the APK is signed with the debug key instead — still installable, but each
# build has a different signature, so you would need to uninstall before updating.
#
# Optional repo secrets for stable release signing:
#   KEYSTORE_BASE64     base64 of your app-signing.jks
#   KEYSTORE_PASSWORD   keystore password
#   KEY_ALIAS           key alias (e.g. tasktree)
#   KEY_PASSWORD        key password

on:
  push:
    branches:
      - "claude/android-task-management-app-7wrdny"
    paths:
      - "android/**"
      - "!android/docs/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure signing (if secrets are present)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/app-signing.jks"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/app-signing.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Release signing key configured."
          else
            echo "No KEYSTORE_BASE64 secret set — signing release with the debug key."
            echo "The APK is still installable; add the secrets for stable update-in-place."
          fi

      - name: Unit tests
        # R77 — gate the APK on the JVM unit suite (domain engines, recurrence, priority, quick-add,
        # backup round-trip, the achievement/coach engines, and the migration-chain assertions). A red
        # test now fails the build instead of shipping. (Instrumented tests that need a device — the
        # Room MigrationTest — run in a separate emulator job when one is configured.)
        # R92/R94 — the suite now also includes the Robolectric integration layer (Room DAO, repository,
        # backup export→import round-trip) and the pure list-rendering pipeline, all on the JVM.
        # R97 — run the DEBUG unit tests: they include the debug-only Compose UI tests (createComposeRule
        # needs ui-test-manifest, which is debugImplementation) alongside every variant-agnostic test.
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        # R95 — Android Lint gates the release the same way. abortOnError is on, so any Error-severity
        # finding fails the build before an APK is produced. Runs against the release variant it ships.
        run: ./gradlew lintRelease --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify permissions — 0 INTERNET / location (the privacy invariant)
        # Kairo is offline-first and permission-free by design: it must never request INTERNET or any
        # location permission. This gate reads the *built release APK's* merged manifest with aapt2 and
        # fails the build if any forbidden permission slipped in (a new dependency's manifest, a stray
        # <uses-permission>, etc.) — the same check done by hand every release, now enforced in CI.
        run: |
          set -euo pipefail
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n1)"
          if [ -z "$AAPT2" ]; then echo "::error::aapt2 not found in build-tools"; exit 1; fi
          APK=app/build/outputs/apk/release/app-release.apk
          echo "Using $AAPT2 on $APK"
          PERMS="$("$AAPT2" dump permissions "$APK" || true)"
          echo "--- declared permissions ---"; echo "$PERMS"
          FORBIDDEN="$(echo "$PERMS" | grep -Ei 'permission.*(INTERNET|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|ACCESS_BACKGROUND_LOCATION)' || true)"
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Forbidden permission(s) found in the release APK:"; echo "$FORBIDDEN"
            exit 1
          fi
          echo "OK — no INTERNET or location permission in the release APK."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToDoCompanion-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
