name: Android CI

on:
  push:
    branches: [ "claude/android-article-reader-app-54qk9q", "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cairn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: ${{ env.CAIRN_KEYSTORE_BASE64 != '' }}
        env:
          CAIRN_KEYSTORE_BASE64: ${{ secrets.CAIRN_KEYSTORE_BASE64 }}
        run: |
          echo "$CAIRN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cairn.keystore"
          echo "CAIRN_KEYSTORE_PATH=$RUNNER_TEMP/cairn.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          CAIRN_KEYSTORE_PASSWORD: ${{ secrets.CAIRN_KEYSTORE_PASSWORD }}
          CAIRN_KEY_ALIAS: ${{ secrets.CAIRN_KEY_ALIAS }}
          CAIRN_KEY_PASSWORD: ${{ secrets.CAIRN_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
